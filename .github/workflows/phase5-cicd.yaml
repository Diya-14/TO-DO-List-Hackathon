name: Phase 5 Build & Push

on:
  push:
    branches: [ "main" ]
    paths:
      - 'phase5/services/**'
      - 'todo-app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./todo-app/backend
            image: todo-backend
          - context: ./todo-app
            image: todo-frontend
            file: ./todo-app/Dockerfile
          - context: ./phase5/services/audit-service
            image: audit-service
          - context: ./phase5/services/reminder-service
            image: reminder-service
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: diyaiqbal14/${{ matrix.image }}:latest
